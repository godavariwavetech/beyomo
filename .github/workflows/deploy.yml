name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────
  # 1. Build React admin dashboard + FTP upload
  # ─────────────────────────────────────────
  deploy-admin:
    name: Admin Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: admin-dashboard
        run: npm install

      - name: Build
        working-directory: admin-dashboard
        run: npm run build

      - name: Upload dist/ to server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./admin-dashboard/dist/
          server-dir: ${{ secrets.FTP_ADMIN_DIR }}
          # Only upload changed files (mirrors the local dist/ to the remote dir)
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

  # ─────────────────────────────────────────
  # 2. FTP upload backend + restart Node app
  # ─────────────────────────────────────────
  deploy-backend:
    name: Backend API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload backend files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ${{ secrets.FTP_BACKEND_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/**
            ssl/privatekey.pem
            ssl/cert.crt
            ssl/ca_bundle.crt
            .env
            backend.zip

      - name: Restart Node.js app via cPanel API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --insecure \
            -u "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/NodeJS/restart_app?app_name=${{ secrets.CPANEL_APP_NAME }}")
          echo "cPanel restart response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: restart returned HTTP $STATUS — check cPanel manually"
          fi
