name: iOS TestFlight (reusable)

# Shared build-and-upload job. Called by ios-beyomo.yml and ios-beyomopartner.yml.
on:
  workflow_call:
    inputs:
      app_dir:
        description: "App folder in the repo (beyomo or beyomopartner)"
        required: true
        type: string

jobs:
  testflight:
    name: ${{ inputs.app_dir }} -> TestFlight
    # Never build/upload from master or any other branch.
    if: github.ref == 'refs/heads/ios-deployment'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ inputs.app_dir }}
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_READONLY: ${{ vars.MATCH_READONLY }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ inputs.app_dir }}/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ${{ inputs.app_dir }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ${{ inputs.app_dir }}/ios/Pods
          key: pods-${{ inputs.app_dir }}-${{ hashFiles(format('{0}/ios/Podfile.lock', inputs.app_dir)) }}
          restore-keys: pods-${{ inputs.app_dir }}-

      - name: Install Pods
        working-directory: ${{ inputs.app_dir }}/ios
        run: bundle exec pod install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_dir }}-ipa
          path: ${{ inputs.app_dir }}/build/*.ipa
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_dir }}-build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/fastlane
          retention-days: 7
