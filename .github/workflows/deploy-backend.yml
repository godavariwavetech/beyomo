name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Never uses --delete: the remote ~/api/ directory also holds runtime
      # data (uploads/, upload_files/, ssl/, logs/, .env) that isn't part of
      # this repo and must never be touched by a code deploy.
      - name: Sync backend code
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }}" \
            --exclude 'node_modules' \
            --exclude 'uploads' \
            --exclude 'upload_files' \
            --exclude 'logs' \
            --exclude 'ssl' \
            --exclude 'public' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude '*.zip' \
            --exclude '*.log' \
            --exclude 'db_export' \
            backend/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/api/"

      - name: Install dependencies and restart
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd ~/api
            npm install --omit=dev
            pm2 restart server
          '
