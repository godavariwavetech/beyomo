name: iOS - beyomo

# Runs only on the ios-deployment branch (never master). Trigger a build by
# pushing to that branch; only pushes touching this app (or the shared
# workflow) start it.
on:
  push:
    branches: [ios-deployment]
    paths:
      - "beyomo/**"
      - ".github/workflows/ios-beyomo.yml"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-beyomo
  cancel-in-progress: false

jobs:
  testflight:
    uses: ./.github/workflows/ios-testflight.yml
    with:
      app_dir: beyomo
    secrets: inherit
